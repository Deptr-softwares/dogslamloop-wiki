<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Submissions | Dogslamloop</title>
    <link rel="stylesheet" href="style/Common.css?v=3d8b8d71">
    <link rel="stylesheet" href="style/Buttons.css?v=3d8b8d71">
    <link rel="stylesheet" href="style/Modals.css?v=3d8b8d71">
    <!-- Forms.css defines .editor-input, which the auth and profile modals
         injected by js/utility/site_utils.js both use. Without it the login form and
         the profile fields render unstyled. -->
    <link rel="stylesheet" href="style/Forms.css?v=3d8b8d71">
    <link rel="stylesheet" href="style/Badges.css?v=3d8b8d71">
    <link rel="stylesheet" href="style/Layout.css?v=3d8b8d71">
    <link rel="stylesheet" href="style/Cards.css?v=3d8b8d71">
    <link rel="stylesheet" href="style/Submissions.css?v=3d8b8d71">
    <link rel="stylesheet" href="style/look-classic.css?v=3d8b8d71">
    <!-- The look picked in Site settings, set before the page paints so the
         other look never shows first. js/utility/site_utils.js keeps it in step after.
         Storage blocked or empty means the default look, silently. -->
    <script>try { if (JSON.parse(localStorage.getItem('dsl_site_settings') || '{}').look === 'classic') document.documentElement.classList.add('look-classic'); } catch (e) {}</script>
</head>
<body class="site-body p-0">

    <!-- MOBILE NAVIGATION -->
    <div class="mobile-top-bar">
        <button type="button" class="mobile-logo-link" id="mobile-nav-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="master-sidebar">
            <img src="medias/images/DogslamloopIcon.webp" class="mobile-logo-img" alt="">
            <span class="mobile-site-title">dogslamloop wiki</span>
        </button>
        <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Open table of contents" aria-expanded="false">☰</button>
    </div>
    <div class="mobile-backdrop" id="mobile-backdrop"></div>

    <div class="site-layout">

        <aside class="global-sidebar-left" id="master-sidebar" aria-label="Site navigation">
            <div class="sidebar-header-top">
                <img src="medias/images/DogslamloopIcon.webp" alt="Site Logo" class="sidebar-site-logo">
                <div class="sidebar-title-container">
                    <a href="index.html" class="site-title">dogslamloop wiki</a>
                    <p class="site-subtitle">Alpha v0.4</p>
                </div>
            </div>
            <button class="sidebar-toggle-btn" aria-label="Collapse sidebar">☰</button>
            <div class="sidebar-master-title">Navigation</div>
            <div id="global-sidebar-nav"><p class="loading-msg loading-msg-sm loading-msg-busy">Loading menu...</p></div>
            <div id="sidebar-dynamic-dock" class="sidebar-dynamic-dock"></div>

            <div class="kofi-btn-wrapper">
                <a href="https://Ko-fi.com/deptr_software_coffee_corner" target="_blank" class="btn-sys btn-sys-yellow">
                    <span class="px-icon" aria-hidden="true" style="--px-icon: url('/medias/icons/kofi.png')"></span>
                    <span class="kofi-text">Support Ko-fi</span>
                </a>
            </div>
        </aside>

        <main class="main-content-area space-y-6">
            <div style="margin-bottom: 1.5rem;">
                <button onclick="window.history.back()" class="btn-ghost">← Back to Previous Page</button>
            </div>

            <header class="character-header" style="margin-bottom: 1.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem;">
                <h2 class="character-title" id="submissions-page-title" style="color: var(--accent-blue);">MY SUBMISSIONS</h2>
                <p style="color: var(--text-muted); font-family: var(--text-mono); font-size: 0.85rem; margin-top: 0.5rem;">Every edit you've submitted, whatever happened to it - pending, in discussion, approved, or declined.</p>
            </header>

            <div id="submissions-list">
                <p class="loading-msg loading-msg-busy">Loading...</p>
            </div>
        </main>

        <!-- v1.0 Part 2 (owner, 2026-10-08): the right sidebar this page had
             none of. Ko-fi is moved to its top by placeKofiOnTheRight
             (js/pages/core/pagebuilder.js); the links are the Main Dashboard's, less
             this page's own. -->
        <aside class="local-sidebar-right" aria-label="Sitewide">
            <div class="sidebar-nav-title">Sitewide</div>
            <a href="forum.html" class="btn-nav">→ Forum</a>
            <a href="recent-changes.html" class="btn-nav">→ View Wiki Edit History</a>
        </aside>
    </div>

    <script src="js/vendor/supabase-js-2.118.0.js"></script>

    <script src="js/utility/site_meta.js?v=3d8b8d71"></script>
    <script src="js/pages/core/pagebuilder.js?v=3d8b8d71"></script>
    <script src="js/utility/search.js?v=3d8b8d71"></script>
    <script src="js/pages/community/submissions.js?v=3d8b8d71"></script>
</body>
</html>
