name: Regenerate Pages

# Refreshes generated artifacts from Supabase and commits them if anything
# changed. Today that means character portraits for social previews
# (data/page-previews.json) and the page stubs that embed them.
#
# workflow_dispatch is the primary path - press the button after changing a
# portrait and it lands in a couple of minutes. The schedule is a backstop, not
# the mechanism: GitHub delays scheduled runs on low-activity repos and
# disables them entirely after 60 days of inactivity, so a tight cron buys
# unreliability rather than freshness.
#
# Deliberately NOT `on: push`. That is loop avoidance at the structural level -
# this workflow commits, and a push trigger would have it retrigger itself.

on:
  workflow_dispatch:
    inputs:
      publish_to_main:
        description: 'Also publish to main (DEPLOYS TO THE LIVE SITE)'
        type: boolean
        default: false
  schedule:
    # Once a day. Portraits change rarely, and the manual button covers "I
    # just changed one and want it live now".
    #
    # A scheduled run NEVER touches main. `inputs` is empty on a schedule
    # event, so publish_to_main is false and the matrix below is next-update
    # alone - see the `targets` job for why that is deliberate rather than a
    # limitation.
    - cron: '0 4 * * *'

# One regeneration at a time. Two runs pushing to the same branch race, and a
# manual publish overlapping the nightly cron is precisely when that happens.
# Not cancel-in-progress: a half-finished regeneration is worse than a queued
# one, and this job is never so urgent that waiting hurts.
concurrency:
  group: regenerate-pages
  cancel-in-progress: false

# Required because this job commits. Nothing else here needs write access.
permissions:
  contents: write

jobs:
  # WHICH BRANCHES THIS RUN REGENERATES.
  #
  # next-update always; main only when publish_to_main is ticked on a manual
  # run.
  #
  # Content is data, not code, and it used to need a code release to go live.
  # The only path from "the owner created a character" to "readers can see it"
  # was a next-update -> main release PR, which drags every unreleased change
  # on next-update along with it. A page created on 2026-09-04 was unreachable
  # until a release two days later for exactly that reason, and the release had
  # to carry unrelated work to get there.
  #
  # main is production and a push to it deploys immediately, so this is a
  # button and not the cron (owner, 2026-09-06). The nightly run keeps
  # refreshing next-update and cannot deploy on its own, which preserves the
  # one property the release PR was really providing: nothing reaches readers
  # unless somebody decided it should. An accidental archive, rename or status
  # change in the owner tools does not go live while nobody is looking.
  targets:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.pick.outputs.branches }}
    steps:
      - id: pick
        run: |
          if [ "${{ inputs.publish_to_main }}" = "true" ]; then
            echo 'branches=["next-update","main"]' >> "$GITHUB_OUTPUT"
          else
            echo 'branches=["next-update"]' >> "$GITHUB_OUTPUT"
          fi

  regenerate:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One leg at a time, next-update first. Two legs pushing concurrently
      # would race, and they write the same generated files.
      max-parallel: 1
      # Each branch is regenerated and tested on its own, so a failure on one
      # is not a reason to skip the other: if unreleased code on next-update
      # has a problem, the owner's content should still be publishable to main.
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.targets.outputs.branches) }}
    env:
      # Not secrets, deliberately. The anon key already ships inside
      # js/site_utils.js and is therefore in the page source of every page on
      # the site - storing it as a repository secret would be theatre.
      #
      # Explicitly NOT the service-role key: that bypasses all RLS, and
      # putting one here would turn any repo compromise into a database
      # compromise. Everything this job reads is already world-readable
      # through the "Public Read Live Data" policy.
      SUPABASE_URL: https://gtqswjspxymjdopljmfi.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0cXN3anNweHltamRvcGxqbWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMzQ1MDIsImV4cCI6MjA5NzkxMDUwMn0.6RsP5Ue1m9X8iGecXa245S3fEdYnDqML-QLux1KUAuw

    steps:
      # Checked out over SSH with a deploy key, not the default GITHUB_TOKEN.
      #
      # The "main: require CI" ruleset requires the `test` check on anything
      # landing on main, and a direct push carries no check run - so it can
      # never satisfy the rule and is rejected outright. This job has to push:
      # regenerating artifacts and then not committing them is the same as not
      # running.
      #
      # A bypass entry is therefore needed, and it has to name an identity the
      # bypass list can actually hold. The default GITHUB_TOKEN identity
      # (github-actions[bot]) is not one: it is not a user, a team, or an
      # installed app, so it cannot be added. A deploy key can, and is already
      # in the list.
      #
      # A deploy key is also the narrowest option available here. It belongs to
      # this repository rather than to a person, so it cannot reach anything
      # else the owner can - which a personal access token would.
      #
      # Verification still happens: this job runs the full suite before it
      # commits. The bypass skips a check the job performs on itself, not a
      # check nobody performed.
      # EACH BRANCH REGENERATES WITH ITS OWN CODE. That is the whole reason
      # this is a matrix rather than one run that copies files across.
      #
      # Generated stubs embed an asset stamp derived from js/, so while
      # next-update carries unreleased JS the two branches legitimately produce
      # different stubs: on 2026-09-06 main was v301ffd47 and next-update
      # v9e9f3511, on all 62 pages. Copying either branch's stubs to the other
      # would stamp every page with the wrong version and conflict on the next
      # release. Re-running the refresh scripts against Supabase on each branch
      # instead gives both the same CONTENT with their own correct stamps, and
      # needs no merge between them.
      #
      # So this job moves data only. The release PR remains the only thing that
      # moves code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          ssh-key: ${{ secrets.REGEN_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Refuses on an empty result set and reports any portrait that no longer
      # resolves, so a transient outage cannot silently blank every preview
      # image on the site.
      - name: Refresh preview images from Supabase
        run: node scripts/fetch-previews.js --write

      # Must run AFTER fetch-previews, which is where the URLs it mirrors come
      # from. It refuses to write a partial mirror, so a Storage outage fails
      # this step rather than committing a manifest with portraits missing.
      - name: Mirror portraits into the repo
        run: node scripts/fetch-portraits.js --write

      # navigation.json is generated too as of v0.10. buildNavigation is
      # round-trip tested against the committed file, and this script refuses
      # to write if the result fails validation - it drives every menu on the
      # site, so a bad run here is the most damaging thing this workflow could
      # do.
      - name: Regenerate navigation from the page registry
        run: node scripts/fetch-registry.js --write

      - name: Regenerate FAQ and credits
        run: node scripts/fetch-content.js --write

      # Must run AFTER fetch-registry: the index maps each page_data row to a
      # live registry entry and skips any row without one, so building it
      # against a stale navigation.json would silently drop a page the owner
      # published today.
      #
      # Deliberately NOT added to `npm run validate`. Every other artifact that
      # check compares is built offline from committed files, so --check is
      # deterministic. This one is fetched from Supabase, which means the owner
      # editing a heading would turn the required `test` check red - and a test
      # an owner edit can break is a production outage, not a failing test. The
      # index simply refreshes here, nightly, like page-previews.json.
      - name: Regenerate the search index
        run: node scripts/fetch-search-index.js --write

      # `npm run generate`, not generate-pages alone. This step used to write
      # one of the five artifacts the next step checks, which made the job
      # structurally unable to succeed at the only times it had work to do:
      # fetching a new or renamed page leaves sitemap.xml and the hub meta
      # tags stale, and Validate fails on them before anything is committed.
      #
      # That is exactly what happened. The Roulette page arrived on 2026-08-09
      # and every scheduled run from then to 2026-08-12 died on
      # "generate-sitemap --check FAILED", so nothing regenerated for three
      # days - including a site version the owner had already changed.
      #
      # The invariant to keep: whatever `npm run validate` checks, `npm run
      # generate` writes, and this step runs the latter. Adding a --check to
      # validate without a matching --write in generate breaks this job, and
      # it breaks it silently, because a passing run and a run with nothing
      # to do look identical from the outside.
      - name: Regenerate stubs, sitemap, hub meta and asset stamps
        run: npm run generate

      - name: Validate
        run: npm run validate

      - run: npx playwright install --with-deps chromium

      # Runs the suite BEFORE committing, which matters more than it looks:
      # pushes made with GITHUB_TOKEN do not trigger other workflows, so the
      # commit this job creates would never run playwright.yml. Relying on
      # "the push-triggered suite will catch it" would be a safety net that
      # silently does not exist. Validate then publish, not publish then hope.
      - name: Test the regenerated tree
        run: npx playwright test

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Nothing to regenerate."
            exit 0
          fi
          git config user.name  "dogslamloop-bot"
          git config user.email "dogslamloop-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate page previews and stubs"
          # Explicit target: the matrix leg decides the branch, and an implicit
          # `git push` here would depend on how checkout happened to set up
          # tracking for a non-default ref.
          git push origin HEAD:${{ matrix.branch }}

      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          # Per-branch: two matrix legs uploading the same artifact name
          # collide, and the failure that matters is "which branch broke".
          name: regenerate-report-${{ matrix.branch }}
          path: playwright-report/
          retention-days: 14
