name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Cheap and fails fast, so it runs before the browser download.
      # Checks navigation.json's shape (this validator existed since v0.6 but
      # was never wired into CI) and that every generated page stub is in sync
      # with it - a stale stub means someone hand-edited a generated file.
      - run: npm run validate

      # playwright.config.js only defines the chromium project, so the other
      # browsers would just be dead download time.
      - run: npx playwright install --with-deps chromium

      # The suite serves the repo with `python -m http.server` (see
      # playwright.config.js webServer) - preinstalled on ubuntu-latest, and
      # reuseExistingServer is already CI-aware.
      # visual.spec.js is skipped here (playwright.config.js testIgnore): its
      # screenshot baselines are OS-specific, so the committed Windows set
      # can never match a Linux runner. It stays a local-only CSS tool.
      - run: npx playwright test

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
