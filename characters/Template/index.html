    <!-- Hand-authored page, but site_utils.js derives FRAME_MOVE_CATEGORIES
         from this and the frame-data renderer runs here too. -->
    <script src="../../js/character_tabs.js?v=bc58f088"></script>
    <script src="../../js/input_slots.js?v=bc58f088"></script>
    <script src="../../js/site_utils.js?v=bc58f088"></script>
    <script src="../../js/site_meta.js"></script>
    <script src="../../js/pagebuilder.js"></script>
    <script src="../../js/framedata.js"></script>
    <script src="../../js/description.js"></script>
    <script src="../../js/internalstyling.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Boot the Master Global Sidebars
            if (window.initSidebarToggle) window.initSidebarToggle();
            if (window.initMobileNav) window.initMobileNav();
            if (window.buildGlobalSidebarMenu) window.buildGlobalSidebarMenu('global-sidebar-nav');
            if (window.initAuthDock) window.initAuthDock(); 

            // Initialize the v0.4 Tab Editor connections (explicitly labeled as 'character')
            if (window.initTabEditorButtons) window.initTabEditorButtons('template', 'character');

            // 2. Setup Inner Tab Navigation
            if (window.setupTabs) setupTabs('nav', 'tab', ['overview', 'm1s', 'skills', 'matchups', 'counterplay'], 'major');

            // 3. Fire all Data Fetchers Concurrently
            if (typeof window.loadMoveSection === 'function') {
                window.loadMoveSection('template', 'skills', null, 'character');
                window.loadMoveSection('template', 'm1s', null, 'character');
            }

            if (typeof window.loadPageDescriptions === 'function') {
                window.loadPageDescriptions('template', 'character');
            }

            if (typeof window.loadPageAlerts === 'function') {
                window.loadPageAlerts('template');
            }

            // 4. Append specific guide logic AFTER standard wiki assembly finishes
            if (typeof displayRawJSON === 'function') {
                setTimeout(() => displayRawJSON('template'), 300); // Delayed to safely attach after description.js populates
            }

            // 5. Delay the TOC mapping to ensure all content blocks have been injected
            setTimeout(() => {
                if (window.refreshTOC) window.refreshTOC();
            }, 500);
        });

        async function displayRawJSON(charId) {
            const overviewTab = document.getElementById('tab-overview');
            if (!overviewTab) return;

            const files = [
                { name: 'Template Descriptions JSON', path: `./${charId}_descriptions.json` },
                { name: 'Template Frame Data JSON', path: `./${charId}_framedata.json` }
            ];

            const jsonContainer = document.createElement('section');
            jsonContainer.className = 'wiki-section space-y-4';
            jsonContainer.style.marginTop = '3rem';
            jsonContainer.innerHTML = '<h2 class="section-title mb-4" style="text-transform: uppercase;">Behind the Scenes: Raw JSON</h2>';

            for (const file of files) {
                try {
                    const data = await window.fetchJson(file.path);
                    if (!data) continue;
                    
                    const details = document.createElement('details');
                    details.className = 'manga-accordion'; 
                    details.style = "background: var(--bg-main, #050505); border: 1px solid var(--border-color, #333); box-shadow: 4px 4px 0px var(--manga-shadow, #000); width: 100%; margin-bottom: 1.5rem;";
                    
                    const summary = document.createElement('summary');
                    summary.style = "position: relative; padding: 0.75rem 2.5rem 0.75rem 1rem; cursor: pointer; font-family: 'CC-Wild-Words', sans-serif; font-size: 0.8rem; color: var(--accent-blue, #3b82f6); list-style: none; outline: none; user-select: none; text-transform: uppercase;";
                    summary.innerHTML = `<span>${file.name}</span> <span class="accordion-arrow" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); font-size: 0.6rem; color: var(--text-muted, #888); transition: transform 0.2s;">▼</span>`;
                    
                    const preContainer = document.createElement('div');
                    preContainer.style = "padding: 1rem; border-top: 1px dashed var(--border-color, #333); background: var(--bg-secondary, #111); display: flex; flex-direction: column; gap: 0.5rem; text-align: left;";

                    const pre = document.createElement('pre');
                    pre.style = "background: #0d1117; padding: 1rem; border-radius: 4px; overflow-x: auto; color: #c9d1d9; font-family: var(--text-mono); font-size: 0.85rem; border: 1px solid #333; margin: 0;";
                    pre.textContent = JSON.stringify(data, null, 2);
                    
                    preContainer.appendChild(pre);
                    details.appendChild(summary);
                    details.appendChild(preContainer);
                    jsonContainer.appendChild(details);
                } catch(e) {
                    console.error(`Could not load ${file.path} through site_utils.`, e);
                }
            }
            overviewTab.appendChild(jsonContainer);
            if (window.refreshTOC) window.refreshTOC(); // Trigger ToC update for newly appended custom JSON section
        }
    </script>
