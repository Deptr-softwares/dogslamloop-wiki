<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Dogslamloop</title>
    <link rel="icon" type="image/jpg" href="medias/images/DogslamloopIcon.webp">

    <meta name="description" content="Search every page, section and move on the Dogslamloop Wiki.">

    <link rel="stylesheet" href="style/Common.css">
    <link rel="stylesheet" href="style/Buttons.css">
    <link rel="stylesheet" href="style/Badges.css">
    <link rel="stylesheet" href="style/Layout.css">
    <link rel="stylesheet" href="style/Cards.css">
    <!-- Modals.css and Forms.css: js/site_utils.js injects the auth, profile
         and alert modals into EVERY page, and they are styled by the first
         (.modal-box, .profile-field) and the second (.editor-input). Seven
         pages shipped without Forms.css and rendered the login form as bare
         browser inputs; tests/modal-stylesheets.spec.js now derives the rule
         so an eighth cannot. This is that eighth page. -->
    <link rel="stylesheet" href="style/Modals.css">
    <link rel="stylesheet" href="style/Forms.css">
</head>
<body class="site-body p-0">

    <!-- MOBILE NAVIGATION -->
    <div class="mobile-top-bar">
        <button type="button" class="mobile-logo-link" id="mobile-nav-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="master-sidebar">
            <img src="medias/images/DogslamloopIcon.webp" class="mobile-logo-img" alt="">
            <span class="mobile-site-title">dogslamloop wiki</span>
        </button>
        <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Open table of contents" aria-expanded="false">☰</button>
    </div>
    <div class="mobile-backdrop" id="mobile-backdrop"></div>

    <div class="site-layout">

        <aside class="global-sidebar-left" id="master-sidebar" aria-label="Site navigation">
            <div class="sidebar-header-top">
                <img src="medias/images/DogslamloopIcon.webp" alt="Site Logo" class="sidebar-site-logo">
                <div class="sidebar-title-container">
                    <a href="index.html" class="site-title">dogslamloop wiki</a>
                    <p class="site-subtitle">Alpha v0.4</p>
                </div>
            </div>
            <button class="sidebar-toggle-btn" id="btn-sidebar-collapse" aria-label="Collapse sidebar">☰</button>
            <div class="sidebar-master-title">Navigation</div>
            <div id="global-sidebar-nav"><p class="loading-msg loading-msg-sm">Loading menu...</p></div>
            <div id="sidebar-dynamic-dock" style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 0.75rem; padding-top: 2rem;"></div>

            <div class="kofi-btn-wrapper">
                <a href="https://Ko-fi.com/deptr_software_coffee_corner" target="_blank" class="btn-sys btn-sys-yellow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                    <span class="kofi-text">Support Ko-fi</span>
                </a>
            </div>
        </aside>

        <main class="main-content-area space-y-6">
            <header class="character-header search-page-header">
                <h2 class="character-title search-page-title">SEARCH</h2>
                <p class="search-page-blurb">
                    Every page, section, move and paragraph on the wiki. The box in the sidebar
                    jumps straight to a page or a section; this one reads the writing too.
                </p>
            </header>

            <form id="search-page-form" class="search-page-form" role="search">
                <label class="sr-only" for="search-page-input">Search the wiki</label>
                <input type="search" id="search-page-input" class="editor-input search-page-input"
                       placeholder="Search every page and every paragraph..."
                       autocomplete="off" spellcheck="false" autofocus>
                <button type="submit" class="btn-sys btn-sys-blue">SEARCH</button>
            </form>

            <div id="search-page-status" class="search-page-status">Loading the index...</div>
            <div id="search-page-results" class="search-page-results"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/character_tabs.js?v=3ba40029"></script>
    <script src="js/input_slots.js?v=3ba40029"></script>
    <script src="js/site_utils.js?v=3ba40029"></script>
    <script src="js/site_meta.js?v=3ba40029"></script>
    <script src="js/pagebuilder.js?v=3ba40029"></script>
    <script src="js/search.js?v=3ba40029"></script>
    <script src="js/search-page.js?v=3ba40029"></script>
</body>
</html>
